[package]
name = "qubit-rayon-executor"
version = "0.6.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-rayon-executor"
description = "Rayon-backed CPU-bound executor service for Qubit Rust libraries"
homepage = "https://github.com/qubit-ltd/rs-rayon-executor"
documentation = "https://docs.rs/qubit-rayon-executor"
readme = "README.md"
keywords = ["rayon", "executor", "cpu", "concurrency"]
categories = ["concurrency"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_rayon_executor"
doctest = true

[dependencies]
rayon = "1.12"
thiserror = "2.0"

qubit-atomic = "0.13"
qubit-executor = { version = "0.7", path = "../rs-executor" }
qubit-function = { version = "0.16.0", path = "../rs-function" }
qubit-lock = { default-features = false, version = "0.11.0", path = "../rs-lock" }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
